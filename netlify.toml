[build]
  command = "bash scripts/netlify-build.sh"
  publish = "site"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
